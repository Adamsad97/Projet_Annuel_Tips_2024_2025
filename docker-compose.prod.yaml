# Projet Docker distinct du développement : la prod ne remplace pas les conteneurs de dev
name: projet-tips-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tips_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tips_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tips_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - projet-tips-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tips_user} -d ${POSTGRES_DB:-tips_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
      dockerfile: Dockerfile
    container_name: backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - tips_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - projet-tips-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/api/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      target: production
      dockerfile: Dockerfile
    container_name: frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - projet-tips-prod
    environment:
      NODE_ENV: production
      # Navigateur : API et temps réel sur le même domaine (routés par nginx)
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_PUBLIC_BACKEND_URL: ""
      NUXT_PUBLIC_ADMINER_URL: ""
      # Adresse publique du site (liens canoniques, sitemap, robots.txt)
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
      NUXT_SITE_URL: ${SITE_URL:-http://localhost}
      # Rendu serveur : appels /api relayés vers le backend interne
      NUXT_API_PROXY_TARGET: http://backend:3001

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf ne contient qu'un bloc server : c'est une config de site (conf.d)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - projet-tips-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  projet-tips-prod:
    driver: bridge

volumes:
  postgres_prod_data:
  tips_uploads:
