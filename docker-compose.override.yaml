services:
  postgres:
    container_name: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - projet-tips-net

  postgres-test:
    container_name: postgres-test
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-tips_test_user}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-tips_test_pass}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-tips_test_db}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_TEST_USER:-tips_test_user} -d $${POSTGRES_TEST_DB:-tips_test_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projet-tips-net

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - projet-tips-net
    environment:
      NODE_ENV: development
      # Emails : réglés dans backend/.env (Mailpit par défaut, ou un vrai SMTP pour les recevoir)

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    networks:
      - projet-tips-net
    # Démarre une fois l'API prête : pas de page en erreur pendant que le backend démarre
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Comme en production : le navigateur appelle /api sur le même domaine et Nuxt relaie
      # vers le backend (server/middleware/api-proxy.ts), y compris pendant le rendu serveur
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_API_PROXY_TARGET: http://backend:3001
      # Temps réel (Socket.io) : le navigateur se connecte directement au backend
      NUXT_PUBLIC_BACKEND_URL: http://localhost:3001
      NUXT_PUBLIC_ADMINER_URL: http://localhost:8080
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      NUXT_WATCH_POLLING: "true"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    container_name: mailpit
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - projet-tips-net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - projet-tips-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  projet-tips-net:
    driver: bridge
volumes:
  postgres-data:
