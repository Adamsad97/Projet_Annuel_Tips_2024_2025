name: CI

# À chaque push et pull request sur develop et main, et à la demande (onglet Actions)
on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']
  workflow_dispatch:

# Un nouveau push annule l'exécution précédente de la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrations, types, lint, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tips_test_db
          POSTGRES_USER: tips_test_user
          POSTGRES_PASSWORD: tips_test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tips_test_user:tips_test_pass@localhost:5432/tips_test_db?schema=public
      JWT_SECRET: ci-jwt-secret-for-tests-only-0123456789
      REFRESH_SECRET: ci-refresh-secret-for-tests-only-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Toutes les migrations sur une base neuve : une migration oubliée ou cassée fait échouer la CI
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # npm ci lance aussi « nuxt prepare » (types générés dans .nuxt)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Production (images Docker + démarrage)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Même configuration que le README (section production), avec des secrets générés
      - name: Create production env file
        run: |
          cp backend/.env.sample backend/.env.production
          sed -i "s/^NODE_ENV=.*/NODE_ENV=production/" backend/.env.production
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 48)/" backend/.env.production
          sed -i "s/^REFRESH_SECRET=.*/REFRESH_SECRET=$(openssl rand -hex 48)/" backend/.env.production

      - name: Build images
        run: docker compose -f docker-compose.prod.yaml build

      - name: Start production stack
        run: docker compose -f docker-compose.prod.yaml up -d

      # nginx -> API (migrations appliquées au démarrage) et nginx -> site rendu par le serveur
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/ping && break
            sleep 3
          done
          curl -sf http://localhost/api/ping | grep -q pong
          curl -sf http://localhost/api/grades | grep -q 'Débutant'
          curl -sf -o /dev/null http://localhost/
          curl -sf -o /dev/null http://localhost/tips
          echo "Production stack OK"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yaml logs --tail=100

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.prod.yaml down -v
